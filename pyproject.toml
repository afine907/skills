[project]
name = "skills"
version = "0.1.0"
description = "A collection of Claude Code skills - reusable prompt templates that extend Claude's capabilities."
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "paramiko>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project.scripts]
validate-skills = "scripts.validate_skills:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
